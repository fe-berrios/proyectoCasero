<ion-content [fullscreen]="true">

  <!-- Botón de volver atrás -->
  <div class="back-button-container">
    <ion-buttons>
      <ion-back-button defaultHref="/mapa"></ion-back-button>
    </ion-buttons>
  </div>

  <!-- Encabezado -->
  <div class="admin-header">
    <h2>Ferias Favoritas</h2>
  </div>

  <!-- Lista de cards personalizada -->
  <ion-list>
    <ion-card *ngFor="let feria of feriasFav" class="custom-card" (click)="abrirFeriaModal(feria)">
      <ion-card-header>
        <ion-card-title style="flex: 1;">{{ feria.nombre }}</ion-card-title>
        <ion-button fill="clear" (click)="confirmarEliminarFavorito($event, feria)" class="bookmark-button">
          <ion-icon name="bookmark" class="bookmark-icon"></ion-icon>
        </ion-button>
      </ion-card-header>
      <ion-card-content>
        <div class="comuna-feria">
          <ion-icon name="business-outline"></ion-icon>
          {{ feria.comuna || 'No especificada' }}
        </div>
        <div class="comuna-feria">
          <ion-icon name="navigate-outline"></ion-icon>
          {{ feria.calle_principal || 'No especificada' }}
        </div>
        <div class="comuna-feria">
          <ion-icon name="time-outline"></ion-icon>
          {{ feria.hora_inicio }} - {{ feria.hora_termino }}
        </div>

        <!--
        <ng-container *ngIf="feria.calificacion !== null && feria.calificacion !== undefined">
          <div class="comuna-feria">
            <ion-icon name="star"></ion-icon>
              <ng-container *ngFor="let i of [1,2,3,4,5]">
                <img [src]="i <= feria.calificacion ? 'assets/icon/rank-mark.png' : 'assets/icon/rank-unmark.png'"
                  alt="estrella" class="rating-icon" />
              </ng-container>
          </div>
        </ng-container>
        -->
        <div class="dias-semana-container">
          <div class="dias-semana-bar">
            <div class="dia-item" [class.activo]="isDiaActivo(feria.dia, 'lun')">
              <span class="dia-corto">Lun</span>
            </div>
            <div class="dia-item" [class.activo]="isDiaActivo(feria.dia, 'mar')">
              <span class="dia-corto">Mar</span>
            </div>
            <div class="dia-item" [class.activo]="isDiaActivo(feria.dia, 'mie')">
              <span class="dia-corto">Mié</span>
            </div>
            <div class="dia-item" [class.activo]="isDiaActivo(feria.dia, 'jue')">
              <span class="dia-corto">Jue</span>
            </div>
            <div class="dia-item" [class.activo]="isDiaActivo(feria.dia, 'vie')">
              <span class="dia-corto">Vie</span>
            </div>
            <div class="dia-item" [class.activo]="isDiaActivo(feria.dia, 'sab')">
              <span class="dia-corto">Sáb</span>
            </div>
            <div class="dia-item" [class.activo]="isDiaActivo(feria.dia, 'dom')">
              <span class="dia-corto">Dom</span>
            </div>
          </div>
        </div>
      </ion-card-content>
    </ion-card>
  </ion-list>

  <ng-template #sinFavoritas>
    <ion-text color="medium">
      <p style="text-align:center; margin-top: 2em;">No tienes ferias favoritas aún.</p>
    </ion-text>
  </ng-template>

</ion-content>
