<ion-content [fullscreen]="true">

  <!-- Botón de volver atrás -->
  <div class="back-button-container">
    <ion-buttons>
      <ion-back-button defaultHref="/mapa"></ion-back-button>
    </ion-buttons>
  </div>

  <!-- Encabezado -->
  <div class="admin-header">
    <h2>Ferias Favoritas</h2>
  </div>

  <!-- Lista de cards personalizada -->
  <ion-list>
    <ion-card *ngFor="let feria of feriasFav" class="custom-card" (click)="abrirFeriaModal(feria)">
      <ion-card-header>
        <ion-card-title style="flex: 1;">{{ feria.nombre }}</ion-card-title>
        <ion-button fill="clear" (click)="confirmarEliminarFavorito($event, feria)" class="bookmark-button">
          <ion-icon name="bookmark" class="bookmark-icon"></ion-icon>
        </ion-button>
      </ion-card-header>
      <ion-card-content>
        <div class="info-row">
          <ion-icon name="business-outline"></ion-icon>
          <span><strong>Comuna:</strong> {{ feria.comuna || 'No especificada' }}</span>
        </div>
        <div class="info-row">
          <ion-icon name="navigate-outline"></ion-icon>
          <span><strong>Calle Principal:</strong> {{ feria.calle_principal || 'No especificada' }}</span>
        </div>
        <div class="info-row">
          <ion-icon name="calendar-outline"></ion-icon>
          <span><strong>Día(s):</strong> {{ feria.dia }}</span>
        </div>
        <div class="info-row">
          <ion-icon name="time-outline"></ion-icon>
          <span><strong>Horario:</strong> {{ feria.hora_inicio }} - {{ feria.hora_termino }}</span>
        </div>
        <ng-container *ngIf="feria.calificacion !== null && feria.calificacion !== undefined">
          <div class="info-row">
            <ion-icon name="star"></ion-icon>
            <span><strong>Calificación:</strong>
              <ng-container *ngFor="let i of [1,2,3,4,5]">
                <img [src]="i <= feria.calificacion ? 'assets/icon/rank-mark.png' : 'assets/icon/rank-unmark.png'"
                  alt="estrella" class="rating-icon" />
              </ng-container>
            </span>
          </div>
        </ng-container>
      </ion-card-content>
    </ion-card>
  </ion-list>

  <ng-template #sinFavoritas>
    <ion-text color="medium">
      <p style="text-align:center; margin-top: 2em;">No tienes ferias favoritas aún.</p>
    </ion-text>
  </ng-template>

</ion-content>
