<ion-menu contentId="main-content" side="start" menuId="main-menu">
  <ion-content class="custom-menu">
    <div class="profile-container">
      <img [src]="profileImgUrl" alt="Foto de perfil" class="profile-img" />
      <div class="profile-info" *ngIf="!loading">
        <h2>{{ userName }}</h2>
      </div>
    </div>

    <ion-list class="menu-options">

      <!-- Botones Publicos -->
      <ion-item routerLink="/account">
        <ion-icon name="person" slot="start"></ion-icon>
        <ion-label>Mi Perfil</ion-label>
      </ion-item>

      <!-- Botones Administrador -->
      <ion-item *ngIf="isAdmin" routerLink="/administrar">
        <ion-icon name="settings" slot="start"></ion-icon>
        <ion-label>Administrar Ferias</ion-label>
      </ion-item>

      <ion-item *ngIf="isAdmin" routerLink="/administrar-puestos">
        <ion-icon name="storefront" slot="start"></ion-icon>
        <ion-label>Administrar Puestos</ion-label>
      </ion-item>

      <ion-item *ngIf="isAdmin" routerLink="/administrar-usuarios">
        <ion-icon name="people" slot="start"></ion-icon>
        <ion-label>Administrar Usuarios</ion-label>
      </ion-item>

      <!-- Botones Casero -->
      <ion-item *ngIf="isCasero" routerLink="/panel-casero">
        <ion-icon name="cog" slot="start"></ion-icon>
        <ion-label>Panel Casero</ion-label>
      </ion-item>

      <!-- Boton Cerrar Sesion -->
      <ion-item (click)="signOut()">
        <ion-icon name="log-out" slot="start"></ion-icon>
        <ion-label>Cerrar sesión</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>

<ion-content id="main-content" [fullscreen]="true">
  <!-- FAB para abrir el menú -->
  <ion-fab vertical="top" horizontal="start" slot="fixed">
    <ion-fab-button class="fab-menu-small" (click)="openMenu()">
      <ion-icon name="menu"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <!-- Logo de la app -->
  <div class="logo-mapa">
    <h1>CASER</h1>
    <img src="../../../assets/tomate.png" alt="Logo de Caser" />
  </div>

  <div class="buscador">
    <ion-searchbar [(ngModel)]="searchTerm" (ionInput)="onSearchChange()" placeholder="Buscar feria" color="light">
    </ion-searchbar>

    <!-- Lista de sugerencias -->
    <ion-list *ngIf="suggestedFerias.length > 0" class="autocomplete-list">
      <ion-item *ngFor="let feria of suggestedFerias" (click)="selectFeria(feria)">
        {{ feria.nombre }}
      </ion-item>
    </ion-list>
  </div>

  <div class="botones-badges">
    <ion-button class="custom-button" (click)="openDaySelector()">Día</ion-button>
    <ion-button class="custom-button" (click)="filterByHorario()">Horario</ion-button>
    <ion-button class="custom-button">Puesto</ion-button>
  </div>

  <div id="map"></div>

  <!-- FAB de ubicación -->
  <ion-fab vertical="bottom" horizontal="end" slot="fixed" class="fab-ubicacion">
    <ion-fab-button (click)="centrarEnUsuario()">
      <ion-icon name="locate"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
