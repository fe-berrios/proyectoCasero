<ion-menu contentId="main-content">
  <ion-header>
    <ion-toolbar>
      <ion-title>Menu</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding">
    <!-- Contenedor de botones en columna -->
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <ion-button routerLink="/account">Mi Perfil</ion-button>

      <!-- Botón de administrar visible solo si es admin -->
      <ion-button *ngIf="isAdmin" routerLink="/administrar">Administrar</ion-button>

      <ion-button (click)="signOut()">Cerrar sesión</ion-button>
    </div>
  </ion-content>
</ion-menu>

<ion-content id="main-content" [fullscreen]="true">
  <div class="buscador">
    <ion-searchbar placeholder="Buscar feria" color="light"></ion-searchbar>
  </div>

  <div class="botones-badges">
    <ion-button (click)="openDaySelector()">Día</ion-button>
    <ion-button (click)="filterByHorario()">Horario</ion-button>
    <ion-button>Puesto</ion-button>
  </div>

  <div id="map"></div>
</ion-content>
