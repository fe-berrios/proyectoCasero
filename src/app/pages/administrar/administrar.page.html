<ion-content [fullscreen]="true">
  <!-- Botón de volver atrás -->
  <ion-buttons class="back-button">
    <ion-back-button defaultHref="/mapa"></ion-back-button>
  </ion-buttons>

  <!-- Encabezado -->
  <div class="admin-header">
    <h2>Administrar Ferias</h2>
  </div>

  <!-- Botón flotante para agregar feria -->
  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button class="fab-button" (click)="abrirModalAgregarFeria()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <!-- Lista de cards personalizada -->
  <ion-list class="ferias-list">
    <ion-card *ngFor="let feria of ferias" class="feria-card">
      <ion-card-header>
        <ion-card-title>{{ feria.nombre }}</ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <div class="info-row">
          <ion-icon name="location-outline"></ion-icon>
          <span class="info-text">{{ feria.comuna || 'No especificada' }} · {{ feria.calle_principal || 'No especificada' }}</span>
        </div>
        
        <div class="info-row">
          <ion-icon name="time-outline"></ion-icon>
          <span class="info-text">{{ feria.hora_inicio }} - {{ feria.hora_termino }} · {{ feria.dia }}</span>
        </div>

        <!-- Botones -->
        <div class="card-actions">
          <ion-button fill="clear" class="action-button edit" (click)="abrirModalEditarFeria(feria)">
            <ion-icon slot="icon-only" name="create-outline"></ion-icon>
          </ion-button>

          <ion-button fill="clear" class="action-button delete" (click)="eliminarFeria(feria.id)">
            <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
          </ion-button>
        </div>
      </ion-card-content>
    </ion-card>
  </ion-list>
</ion-content>
