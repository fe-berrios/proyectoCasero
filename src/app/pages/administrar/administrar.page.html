<ion-content [fullscreen]="true">

  <!-- Botón de volver atrás -->
  <div class="back-button-container">
    <ion-buttons>
      <ion-back-button defaultHref="/mapa"></ion-back-button>
    </ion-buttons>
  </div>

  <!-- Encabezado -->
  <div class="admin-header">
    <h2>Administrar Ferias</h2>
  </div>

  <!-- Botón para abrir el modal -->
  <div class="modal-trigger-container ion-padding">
    <ion-button expand="block" color="success" (click)="abrirModalAgregarFeria()">
      Agregar Feria
    </ion-button>
  </div>

</ion-content>
