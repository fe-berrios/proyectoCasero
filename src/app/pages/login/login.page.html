<ion-content class="login-content">
  <div class="contenedor">
    <div class="logo">
      <img src="../../../assets/icon/casero_logo.png" alt="Logo" class="logo-img">
    </div>
    <h1 class="login-title">¡Bienvenido a Casero!</h1>
    <p class="login-subtitle">Acercando la feria libre a tu bolsillo</p>
    <form (submit)="handleLogin($event)" class="login-form">
      <ion-item lines="none" class="input-item">
        <ion-input
          label="Correo"
          labelPlacement="floating"
          type="email"
          fill="solid"
          [(ngModel)]="email"
          name="email"
          required
          class="input-solid"
        ></ion-input>
      </ion-item>
      <ion-item lines="none" class="input-item">
        <ion-input
          label="Contraseña"
          labelPlacement="floating"
          [type]="showPassword ? 'text' : 'password'"
          fill="solid"
          name="password"
          required
          class="input-solid"
        ></ion-input>
        <ion-icon
          slot="end"
          name="eye"
          *ngIf="!showPassword"
          class="toggle-eye"
          (click)="showPassword = true"
        ></ion-icon>
        <ion-icon
          slot="end"
          name="eye-off"
          *ngIf="showPassword"
          class="toggle-eye"
          (click)="showPassword = false"
        ></ion-icon>
      </ion-item>
      <button expand="full" class="button login-btn" type="submit">ENTRAR</button>
      <div class="forgot-text">
        <span class="forgot-link">¿Olvidaste tu contraseña?</span>
      </div>
    </form>
    <div class="register-footer">
      <span>¿No tienes cuenta? <span class="register-link">¡Regístrate!</span></span>
    </div>
  </div>
</ion-content>
