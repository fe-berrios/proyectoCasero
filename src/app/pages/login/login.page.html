<ion-content>

  <div class="contenedor">

    <div class="logo">
      <h1>CASER</h1>
      <img src="../../../assets/tomate.png">
    </div>

    <form (submit)="handleLogin($event)">

      <div style="display: flex; flex-direction: column;">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" class="input" required>
      </div>

      <button expand="full" class="button" type="submit">Entrar</button>

    </form>


  </div>

</ion-content>
