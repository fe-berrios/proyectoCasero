<ion-content>
  <ion-header>
    <ion-toolbar>
      <ion-title>Login</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-item>
    <ion-label position="floating">Correo Electrónico</ion-label>
    <ion-input type="email"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Contraseña</ion-label>
    <ion-input type="password"></ion-input>
  </ion-item>

  <ion-button expand="full" (click)="navigateTo('registro')">Registrarse</ion-button>
  <ion-button expand="full" (click)="navigateTo('home/mapa')">Iniciar sesión</ion-button>
</ion-content>
