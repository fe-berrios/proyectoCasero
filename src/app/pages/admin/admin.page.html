<ion-header>
  <ion-toolbar>
    <ion-title>Administración de Ferias</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card>
    <ion-card-header>
      <ion-card-title>Crear Nueva Feria</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-item>
        <ion-label position="floating">ID</ion-label>
        <ion-input [(ngModel)]="nuevaFeria.id"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Nombre</ion-label>
        <ion-input [(ngModel)]="nuevaFeria.name"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Ubicación</ion-label>
        <ion-input [(ngModel)]="nuevaFeria.location"></ion-input>
      </ion-item>
      <ion-button expand="block" (click)="crearFeria()">Crear Feria</ion-button>
    </ion-card-content>
  </ion-card>

  <ion-list>
    <ion-list-header>
      <ion-label>Ferias Existentes</ion-label>
    </ion-list-header>
    <ion-item *ngFor="let feria of ferias">
      <ion-label>
        <h2>{{ feria.name }}</h2>
        <p>{{ feria.location }}</p>
      </ion-label>
      <ion-button color="danger" (click)="eliminarFeria(feria.id)">Eliminar</ion-button>
    </ion-item>
  </ion-list>
</ion-content>
