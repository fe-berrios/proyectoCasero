<ion-header>
  <ion-toolbar class="header-toolbar">
    <ion-buttons slot="start">
      <ion-button class="close-button" (click)="cerrarModal()">
        <ion-icon name="close" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title class="header-title">Comentar Feria</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="comment-container">
    <ion-textarea [(ngModel)]="comentario" placeholder="Escribe tu comentario..." autoGrow="true"
      rows="6"></ion-textarea>
  </div>
  
  <div class="error-message" *ngIf="isComentarioInvalido">
    El comentario no puede contener los símbolos &lt; &gt; {{ '{' }} {{ '}' }} [ ] " ' / \
  </div>
  <ion-button class="enviar-button" expand="block" (click)="enviarComentario()"
    [disabled]="enviando || isComentarioInvalido">
    {{ enviando ? 'Enviando...' : 'Enviar' }}
  </ion-button>
</ion-content>
