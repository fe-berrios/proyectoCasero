<ion-header>
  <ion-toolbar color="success">
    <ion-title>Detalles de la Feria</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="closeModal()">Cerrar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" [fullscreen]="true">
  <div class="feria-container">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Información General</ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <ion-item lines="none">
          <ion-label><strong>ID:</strong> {{ feria.id }}</ion-label>
        </ion-item>

        <ion-item lines="none">
          <ion-label><strong>Feria:</strong> "{{ feria.nombre }}"</ion-label>
        </ion-item>

        <ion-item lines="none">
          <ion-label><strong>Hora inicio:</strong> "{{ feria.hora_inicio }}"</ion-label>
        </ion-item>

        <ion-item lines="none">
          <ion-label><strong>Hora término:</strong> "{{ feria.hora_termino }}"</ion-label>
        </ion-item>

        <ion-item lines="none">
          <ion-label><strong>Día:</strong> "{{ feria.dia }}"</ion-label>
        </ion-item>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
