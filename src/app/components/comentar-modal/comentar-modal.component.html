<ion-header>
  <ion-toolbar>
    <ion-title>Calificar Puesto</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cerrar()">Cerrar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-label position="stacked">Comentario</ion-label>
    <ion-textarea rows="4" [(ngModel)]="comentario"></ion-textarea>
  </ion-item>

  <ion-item>
    <ion-label>Calificación</ion-label>
    <ion-range min="1" max="5" step="1" snaps="true" [(ngModel)]="calificacion">
      <ion-icon slot="start" name="star-outline"></ion-icon>
      <ion-icon slot="end" name="star"></ion-icon>
    </ion-range>
  </ion-item>

  <ion-button expand="block" (click)="enviar()">Enviar</ion-button>
</ion-content>
