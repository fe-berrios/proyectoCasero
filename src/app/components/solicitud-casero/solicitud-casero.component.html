<ion-header>
  <ion-toolbar class="header-toolbar">
    <ion-buttons slot="start">
      <ion-button class="close-button" (click)="cerrarModal()">
        <ion-icon name="close" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title class="header-title">Solicitud de Casero</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content *ngIf="!loading" class="ion-padding solicitud-content">
  <div class="form-container">
    <!-- Datos del solicitante -->
    <div class="form-section">
      <h2 class="applicant-name">{{ perfil?.full_name || solicitud?.email }}</h2>
      <div class="form-grid">
        <div class="form-group">
          <label>Fecha de Solicitud</label>
          <input type="text" [value]="solicitud?.created_at | date: 'dd/MM/yyyy HH:mm'" readonly>
        </div>
        <div class="form-group">
          <label>Código Casero</label>
          <input type="text" [value]="solicitud.profiles?.codigo_casero" readonly>
        </div>
        <div class="form-group">
          <label>Estado</label>
          <input type="text" [value]="solicitud?.status" readonly>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="text" [value]="solicitud?.email" readonly>
        </div>
        <div class="form-group">
          <label>Teléfono</label>
          <input type="text" [value]="solicitud?.telefono" readonly>
        </div>
        <div class="form-group">
          <label>RUN</label>
          <input type="text" [value]="runDvFormateado" readonly>
        </div>
      </div>
      
      <!-- Comentario -->
      <div class="form-group comment-group">
        <label>Comentario</label>
        <textarea readonly>{{ solicitud?.comentario }}</textarea>
      </div>
    </div>

    <!-- Documento adjunto -->
    <div class="document-section">
      <h3 class="section-title">Documento Adjunto</h3>
      <div class="document-actions">
        <ion-button class="document-button download" expand="block" shape="round" 
                   (click)="descargarDocumento()" 
                   [disabled]="descargando || !solicitud?.documento_url">
          <ion-icon name="download-outline" slot="start"></ion-icon>
          {{ descargando ? 'Descargando...' : 'Descargar' }}
        </ion-button>

        <ion-button *ngIf="descargadoLocalPath" class="document-button view" expand="block" shape="round" 
                   (click)="abrirDocumento()" [disabled]="!descargadoLocalPath">
          <ion-icon name="eye-outline" slot="start"></ion-icon>
          Ver Documento
        </ion-button>
      </div>
    </div>

    <!-- Acciones -->
    <div class="action-buttons">
      <ion-button class="accept" fill="solid" shape="round" (click)="aceptarSolicitud()">
        Aceptar
      </ion-button>
      <ion-button class="pending" fill="outline" shape="round" (click)="pendienteSolicitud()">
        Pendiente
      </ion-button>
      <ion-button class="deny" fill="outline" shape="round" (click)="rechazarSolicitud()">
        Rechazar
      </ion-button>
    </div>
  </div>
</ion-content>

<ion-spinner *ngIf="loading" class="loading-spinner"></ion-spinner>
