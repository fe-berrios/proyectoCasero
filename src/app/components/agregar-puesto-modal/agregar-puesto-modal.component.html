<ion-header>
  <ion-toolbar class="header-toolbar">
    <ion-buttons slot="start">
      <ion-button class="close-button" (click)="closeModal()">
        <ion-icon name="close" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title class="header-title">Agregar Puesto</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="form-content">
  <form class="puesto-form">
    <!-- Campo Nombre -->
    <ion-item class="form-item">
      <ion-input 
        type="text" 
        label="Nombre del Puesto" 
        label-placement="floating" 
        fill="outline" 
        [(ngModel)]="nombre"
        name="nombre"
        class="custom-input">
      </ion-input>
    </ion-item>

    <!-- Campo Descripción -->
    <ion-item class="form-item">
      <ion-textarea 
        label="Descripción" 
        label-placement="floating" 
        fill="outline" 
        [(ngModel)]="descripcion"
        name="descripcion" 
        rows="3"
        class="custom-textarea">
      </ion-textarea>
    </ion-item>

    <!-- Campo ID Casero -->
    <ion-item class="form-item">
      <ion-input 
        type="text" 
        label="ID Casero" 
        label-placement="floating" 
        fill="outline" 
        [(ngModel)]="casero_id"
        name="casero_id"
        class="custom-input">
      </ion-input>
    </ion-item>

    <!-- Subida de Imagen -->
    <div class="image-upload-container">
      <input type="file" accept="image/*" (change)="subirImagen($event)" hidden #fileInput />
      <ion-button class="upload-button" (click)="fileInput.click()">
        <ion-icon name="image-outline" slot="start"></ion-icon>
        Seleccionar Imagen
      </ion-button>
      
      <div class="image-preview" *ngIf="img_url">
        <img [src]="img_url" alt="Imagen del puesto" />
      </div>
    </div>

    <!-- Campo Ubicación -->
    <ion-item class="form-item">
      <ion-input 
        type="text" 
        label="Ubicación" 
        label-placement="floating" 
        fill="outline" 
        [(ngModel)]="ubicacion"
        name="ubicacion"
        class="custom-input">
      </ion-input>
    </ion-item>

    <!-- Selector de Feria -->
    <ion-item class="form-item accordion-item" button (click)="toggleAccordion()">
      <ion-label>{{ feria_id ? nombreFeriaSeleccionada : 'Seleccionar Feria' }}</ion-label>
      <ion-icon slot="end" [name]="isAccordionOpen ? 'chevron-up' : 'chevron-down'"></ion-icon>
    </ion-item>

    <div *ngIf="isAccordionOpen" class="accordion-content">
      <ion-searchbar 
        [(ngModel)]="filtroFerias" 
        name="filtroFerias" 
        (ionInput)="actualizarFiltro($event)" 
        debounce="300"
        placeholder="Buscar feria..."
        class="search-bar">
      </ion-searchbar>

      <ion-list class="ferias-list">
        <ion-item 
          *ngFor="let feria of feriasFiltradas" 
          button 
          detail="false" 
          (click)="seleccionarFeria(feria)"
          [class.selected]="feria_id === feria.id"
          class="feria-item">
          {{ feria.nombre }}
        </ion-item>
      </ion-list>
    </div>

    <!-- Selector de Tipos de Productos -->
    <ion-item class="form-item accordion-item" button (click)="toggleTiposAccordion()">
      <ion-label>
        {{ tiposSeleccionados.length > 0 ? tiposSeleccionados.join(', ') : 'Seleccionar Tipos de Productos' }}
      </ion-label>
      <ion-icon slot="end" [name]="isTiposAccordionOpen ? 'chevron-up' : 'chevron-down'"></ion-icon>
    </ion-item>

    <div *ngIf="isTiposAccordionOpen" class="accordion-content">
      <ion-list class="tipos-list">
        <ion-item *ngFor="let tipo of tiposDisponibles" class="tipo-item">
          <ion-checkbox 
            slot="start" 
            [checked]="tiposSeleccionados.includes(tipo)"
            (ionChange)="toggleTipoProducto(tipo)"
            class="tipo-checkbox">
          </ion-checkbox>
          <ion-label>{{ tipo }}</ion-label>
        </ion-item>
      </ion-list>
    </div>

    <!-- Botón Guardar -->
    <ion-button 
      expand="block" 
      class="save-button" 
      (click)="savePuesto()">
      Guardar Puesto
    </ion-button>
  </form>
</ion-content>
