<ion-header>
  <ion-toolbar class="header-toolbar">
    <ion-buttons slot="start">
      <ion-button class="close-button" (click)="closeModal()">
        <ion-icon name="close" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title class="header-title">Modificar Feria</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="form-content">
  <form class="feria-form">
    <!-- Nombre -->
    <ion-item class="form-item">
      <ion-input 
        type="text" 
        label="Nombre de la Feria" 
        label-placement="floating" 
        fill="outline" 
        [(ngModel)]="nombre"
        name="nombre"
        class="custom-input">
      </ion-input>
    </ion-item>

    <!-- Horarios -->
    <div class="time-container">
      <ion-item class="time-item">
        <ion-label position="stacked">Hora de Inicio</ion-label>
        <div class="time-inputs">
          <ion-input 
            type="number" 
            placeholder="HH" 
            min="0" 
            max="23" 
            [(ngModel)]="horaInicioHora" 
            name="horaInicioHora"
            (ionChange)="validarHoras()"
            class="time-input">
          </ion-input>
          <span class="time-separator">:</span>
          <ion-input 
            type="number" 
            placeholder="MM" 
            min="0" 
            max="59" 
            [(ngModel)]="horaInicioMinuto"
            name="horaInicioMinuto" 
            (ionChange)="validarHoras()"
            class="time-input">
          </ion-input>
        </div>
        <ion-text color="danger" *ngIf="errorHoraInicio">{{ errorHoraInicio }}</ion-text>
      </ion-item>

      <ion-item class="time-item">
        <ion-label position="stacked">Hora de Término</ion-label>
        <div class="time-inputs">
          <ion-input 
            type="number" 
            placeholder="HH" 
            min="0" 
            max="23" 
            [(ngModel)]="horaTerminoHora" 
            name="horaTerminoHora"
            (ionChange)="validarHoras()"
            class="time-input">
          </ion-input>
          <span class="time-separator">:</span>
          <ion-input 
            type="number" 
            placeholder="MM" 
            min="0" 
            max="59" 
            [(ngModel)]="horaTerminoMinuto"
            name="horaTerminoMinuto" 
            (ionChange)="validarHoras()"
            class="time-input">
          </ion-input>
        </div>
        <ion-text color="danger" *ngIf="errorHoraTermino">{{ errorHoraTermino }}</ion-text>
      </ion-item>
    </div>

    <!-- Comuna -->
    <ion-item class="form-item">
      <ion-select 
        [(ngModel)]="comuna" 
        name="comuna" 
        placeholder="Comuna"
        interface="action-sheet"
        class="custom-select">
        <ion-select-option *ngFor="let comuna of comunasDisponibles" [value]="comuna">
          {{ comuna }}
        </ion-select-option>
      </ion-select>
    </ion-item>

    <!-- Calle Principal -->
    <ion-item class="form-item">
      <ion-input 
        type="text" 
        label="Calle Principal" 
        label-placement="floating" 
        fill="outline" 
        [(ngModel)]="calle_principal" 
        name="calle_principal"
        class="custom-input">
      </ion-input>
    </ion-item>

    <!-- Días -->
    <ion-item class="form-item dropdown-trigger" button lines="none" (click)="toggleDiasDropdown()">
      <ion-label>Día(s)</ion-label>
      <ion-note slot="end" class="selected-days">
        {{ dia.length > 0 ? dia.join(' - ') : 'Seleccionar' }}
      </ion-note>
      <ion-icon slot="end" [name]="showDiasDropdown ? 'chevron-up' : 'chevron-down'"></ion-icon>
    </ion-item>

    <div *ngIf="showDiasDropdown" class="dropdown-content">
      <ion-list lines="none">
        <ion-item *ngFor="let d of diasSemana" class="dropdown-item">
          <ion-checkbox 
            slot="start" 
            [checked]="isDiaSelected(d.value)" 
            (ionChange)="toggleDia(d.value, $event)"
            class="day-checkbox">
          </ion-checkbox>
          <ion-label>{{ d.label }}</ion-label>
        </ion-item>
      </ion-list>
    </div>

    <!-- Ubicación -->
    <ion-button 
      fill="outline" 
      class="location-button" 
      (click)="openPlaceSelectorModal()">
      <ion-icon name="location-outline" slot="start"></ion-icon>
      {{ lat !== null && lng !== null ? 'Ubicación seleccionada' : 'Seleccionar ubicación' }}
    </ion-button>

    <!-- Botón Guardar -->
    <ion-button 
      expand="block" 
      class="save-button" 
      (click)="updateFeria()">
      Guardar Cambios
    </ion-button>
  </form>
</ion-content>
