<ion-header>
  <ion-toolbar class="header-toolbar">
    <ion-buttons slot="start">
      <ion-button class="close-button" (click)="closeModal()">
        <ion-icon name="close" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title class="header-title">Agregar Feria</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="form-content">
  <form class="feria-form">
    <!-- Nombre -->
    <ion-item class="form-item">
      <ion-input 
        type="text" 
        label="Nombre de la Feria" 
        label-placement="floating" 
        fill="outline" 
        [(ngModel)]="nombre"
        name="nombre">
      </ion-input>
    </ion-item>

    <!-- Horarios -->
    <div class="time-container">
      <ion-item class="time-item">
        <ion-label position="stacked">Hora de Inicio</ion-label>
        <div class="time-inputs">
          <ion-input 
            type="text" 
            maxlength="2" 
            placeholder="HH" 
            [(ngModel)]="horaInicioHora" 
            name="horaInicioHora"
            (ionBlur)="formatearHora('horaInicioHora')">
          </ion-input>
          <span class="time-separator">:</span>
          <ion-input 
            type="text" 
            maxlength="2" 
            placeholder="MM" 
            [(ngModel)]="horaInicioMinuto" 
            name="horaInicioMinuto"
            (ionBlur)="formatearHora('horaInicioMinuto')">
          </ion-input>
        </div>
      </ion-item>

      <ion-item class="time-item">
        <ion-label position="stacked">Hora de Término</ion-label>
        <div class="time-inputs">
          <ion-input 
            type="text" 
            maxlength="2" 
            placeholder="HH" 
            [(ngModel)]="horaTerminoHora" 
            name="horaTerminoHora"
            (ionBlur)="formatearHora('horaTerminoHora')">
          </ion-input>
          <span class="time-separator">:</span>
          <ion-input 
            type="text" 
            maxlength="2" 
            placeholder="MM" 
            [(ngModel)]="horaTerminoMinuto" 
            name="horaTerminoMinuto"
            (ionBlur)="formatearHora('horaTerminoMinuto')">
          </ion-input>
        </div>
      </ion-item>
    </div>

    <!-- Días -->
    <ion-item class="form-item dropdown-trigger" button lines="none" (click)="toggleDiasDropdown()">
      <ion-label>Día(s)</ion-label>
      <ion-note slot="end" class="selected-days">
        {{ dia.length > 0 ? dia.join(' - ') : 'Seleccionar' }}
      </ion-note>
      <ion-icon slot="end" [name]="showDiasDropdown ? 'chevron-up' : 'chevron-down'"></ion-icon>
    </ion-item>

    <div *ngIf="showDiasDropdown" class="dropdown-content">
      <ion-list lines="none">
        <ion-item *ngFor="let d of diasSemana" class="dropdown-item">
          <ion-checkbox 
            slot="start" 
            [checked]="isDiaSelected(d.value)" 
            (ionChange)="toggleDia(d.value, $event)"
            class="day-checkbox">
          </ion-checkbox>
          <ion-label>{{ d.label }}</ion-label>
        </ion-item>
      </ion-list>
    </div>

    <!-- Ubicación -->
    <ion-button 
      fill="outline" 
      class="location-button" 
      (click)="openPlaceSelectorModal()">
      <ion-icon name="location-outline" slot="start"></ion-icon>
      {{ lat !== null && lng !== null ? 'Ubicación seleccionada' : 'Seleccionar ubicación' }}
    </ion-button>

    <!-- Comuna -->
    <ion-item class="form-item">
      <ion-select 
        [(ngModel)]="comuna" 
        name="comuna" 
        placeholder="Comuna"
        interface="action-sheet">
        <ion-select-option *ngFor="let comuna of comunasDisponibles" [value]="comuna">
          {{ comuna }}
        </ion-select-option>
      </ion-select>
    </ion-item>

    <!-- Calle Principal -->
    <ion-item class="form-item">
      <ion-input 
        type="text" 
        label="Calle Principal" 
        label-placement="floating" 
        fill="outline" 
        [(ngModel)]="calle_principal" 
        name="calle_principal">
      </ion-input>
    </ion-item>

    <!-- Botón Guardar -->
    <ion-button 
      expand="block" 
      class="save-button" 
      (click)="saveFeria()">
      Guardar Feria
    </ion-button>
  </form>
</ion-content>
