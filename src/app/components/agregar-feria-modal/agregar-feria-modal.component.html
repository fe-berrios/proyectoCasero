<ion-header>
  <ion-toolbar class="custom-toolbar">
    <ion-title>Agregar Feria</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="closeModal()">Cerrar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" [fullscreen]="true">
  <form class="admin-form">
    <ion-input type="text" label="Nombre de la Feria" label-placement="floating" fill="outline" [(ngModel)]="nombre"
      name="nombre"></ion-input>

    <ion-input type="number" label="Latitud" label-placement="floating" fill="outline" [(ngModel)]="lat"
      name="lat"></ion-input>

    <ion-input type="number" label="Longitud" label-placement="floating" fill="outline" [(ngModel)]="lng"
      name="lng"></ion-input>

    <ion-item lines="none">
      <ion-label position="stacked">Hora de Inicio</ion-label>
      <div class="time-inputs">
        <ion-input type="number" placeholder="HH" min="0" max="23" [(ngModel)]="horaInicioHora" name="horaInicioHora"
          (ionChange)="validarHoras()"></ion-input>
        <span>:</span>
        <ion-input type="number" placeholder="MM" min="0" max="59" [(ngModel)]="horaInicioMinuto"
          name="horaInicioMinuto" (ionChange)="validarHoras()"></ion-input>
      </div>
      <ion-text color="danger" *ngIf="errorHoraInicio">{{ errorHoraInicio }}</ion-text>
    </ion-item>

    <ion-item lines="none">
      <ion-label position="stacked">Hora de Término</ion-label>
      <div class="time-inputs">
        <ion-input type="number" placeholder="HH" min="0" max="23" [(ngModel)]="horaTerminoHora"
          name="horaTerminoHora" (ionChange)="validarHoras()"></ion-input>
        <span>:</span>
        <ion-input type="number" placeholder="MM" min="0" max="59" [(ngModel)]="horaTerminoMinuto"
          name="horaTerminoMinuto" (ionChange)="validarHoras()"></ion-input>
      </div>
      <ion-text color="danger" *ngIf="errorHoraTermino">{{ errorHoraTermino }}</ion-text>
    </ion-item>

    <ion-item button lines="none" (click)="toggleDiasDropdown()">
      <ion-label>Día(s)</ion-label>
      <ion-note slot="end" color="medium">
        {{ dia.length > 0 ? dia.join(' - ') : 'Seleccione días' }}
      </ion-note>
      <ion-icon slot="end" [name]="showDiasDropdown ? 'chevron-up-outline' : 'chevron-down-outline'"></ion-icon>
    </ion-item>

    <div *ngIf="showDiasDropdown" class="dias-dropdown">
      <ion-list lines="none">
        <ion-item *ngFor="let d of diasSemana">
          <ion-label>{{ d.label }}</ion-label>
          <ion-checkbox slot="start" [checked]="isDiaSelected(d.value)" (ionChange)="toggleDia(d.value, $event)">
          </ion-checkbox>
        </ion-item>
      </ion-list>
    </div>

    <ion-button shape="round" class="save-button" (click)="saveFeria()">Guardar Feria</ion-button>
  </form>
</ion-content>
